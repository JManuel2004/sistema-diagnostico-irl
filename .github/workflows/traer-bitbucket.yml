# Cada tres horas mira la rama dev de Bitbucket y, si hay commits nuevos,
# los mezcla en la dev de GitHub. No reemplaza esa rama: el pipeline, Vercel
# y el ingreso de prueba se quedan.
#
# El push lo hace un token propio. El token automático de Actions no
# dispara «Verificar y desplegar», y entonces el cambio llegaría a GitHub
# sin publicarse.
#
# Secretos (Settings → Secrets and variables → Actions):
#   PUSH_TOKEN              token con permiso de escritura en este repositorio
#   BITBUCKET_USERNAME      solo si el clon de Bitbucket pide usuario
#   BITBUCKET_READ_TOKEN    solo si el clon de Bitbucket pide contraseña
#
# Si la mezcla tiene conflictos, este job falla y no hace push. El despliegue
# no cambia. Hay que mezclar esos archivos a mano.

name: Traer dev de Bitbucket

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: traer-bitbucket
  cancel-in-progress: false

jobs:
  traer:
    name: Mezclar dev de Bitbucket
    runs-on: ubuntu-latest
    steps:
      - name: Traer GitHub dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false

      - name: Mezclar y publicar si hay commits nuevos
        env:
          BB_USER: ${{ secrets.BITBUCKET_USERNAME }}
          BB_TOKEN: ${{ secrets.BITBUCKET_READ_TOKEN }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PUSH_TOKEN}" ]; then
            echo "Falta el secreto PUSH_TOKEN. Sin él no se publica nada y la rama dev no se toca."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add bitbucket "https://pi2tools.icesi.edu.co/bitbucket/scm/pdgdiag/sistema-diagnostico-irl.git"
          if [ -n "${BB_TOKEN}" ]; then
            if [ -z "${BB_USER}" ]; then
              echo "::error::BITBUCKET_READ_TOKEN está puesto y falta BITBUCKET_USERNAME."
              exit 1
            fi
            auth=$(printf '%s:%s' "$BB_USER" "$BB_TOKEN" | base64 -w 0)
            git -c "http.extraheader=Authorization: Basic ${auth}" fetch bitbucket dev
          else
            git fetch bitbucket dev
          fi
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Bitbucket dev no tiene commits nuevos."
            exit 0
          fi

          if ! git merge --no-edit -m "enhance: update + [dev] - [bring bitbucket dev into github]" FETCH_HEAD; then
            echo "::error::La mezcla tiene conflictos. GitHub dev no se modifica."
            git diff --name-only --diff-filter=U || true
            git merge --abort || true
            exit 1
          fi

          git push "https://x-access-token:${PUSH_TOKEN}@github.com/JManuel2004/sistema-diagnostico-irl.git" HEAD:dev
          echo "Bitbucket dev quedó mezclado en GitHub. El pipeline de despliegue revisa ese push."
