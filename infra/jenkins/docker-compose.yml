# Jenkins for this repository, on http://localhost:8088.
#
#   DOCKER_GID=$(stat -c %g /var/run/docker.sock) \
#   JENKINS_ADMIN_PASSWORD=<a password> \
#   JENKINS_DEFAULT_BRANCH=$(git branch --show-current) \
#     docker compose -f infra/jenkins/docker-compose.yml up -d --build
#
# See docs/workflows/CI-JENKINS.md, including the security trade-off of the
# mounted Docker socket.
name: irl-jenkins

services:
  jenkins:
    build: .
    container_name: irl-jenkins
    ports:
      - '8088:8080'
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-admin}
      JENKINS_DEFAULT_BRANCH: ${JENKINS_DEFAULT_BRANCH:-dev}
      JAVA_OPTS: >-
        -Djenkins.install.runSetupWizard=false
        -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
        -Dhudson.model.DirectoryBrowserSupport.CSP=
    # The host's Docker: test services, Testcontainers and the deployment.
    group_add:
      - '${DOCKER_GID:-999}'
    volumes:
      - irl-jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      # The repository, read-only: the job clones the branch from it.
      - ../..:/repo:ro
    # Containers started through the socket publish their ports on the host.
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  irl-jenkins-home:
